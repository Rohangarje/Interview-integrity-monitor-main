<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Integrity Monitor</title>
    <meta
      name="description"
      content="Interview Integrity Monitor is a Django-based proctoring system for online interviews."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(90vw, 720px);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      }
      h1 { margin-top: 0; font-size: 2rem; }
      p { line-height: 1.6; color: #dbeafe; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      a {
        text-decoration: none;
        color: #0f172a;
        background: #f8fafc;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
      }
      a.secondary { background: transparent; color: #f8fafc; border: 1px solid #f8fafc; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Interview Integrity Monitor</h1>
      <p>
        This repository contains a Django-based interview monitoring system that detects
        suspicious behavior during online interviews. The live GitHub Pages site is a
        landing page for the project while the full monitoring app runs locally.
      </p>
      <div class="actions">
        <a href="https://github.com/Rohangarje/Interview-integrity-monitor-main" target="_blank" rel="noreferrer">Open GitHub</a>
        <a class="secondary" href="https://github.com/Rohangarje/Interview-integrity-monitor-main" target="_blank" rel="noreferrer">View Repository</a>
      </div>
    </main>
  </body>
</html>
